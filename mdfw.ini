; mdfw.ini - MD/MJPEG built for EmuMD (mdfw build), to run in Hatari.
; https://github.com/neilrackett/emumd; paths are relative to this file.

[firmware]
name = MD/MJPEG
output = build/md-mjpeg.mdfw
; Built on the SidecarTridge microfirmware template: its own main() runs,
; with EmuMD standing in for the template's hardware (romemul.c,
; commemul.c, select.c, hw_config.c and sdcard.c are left out) and the
; Booster. The version comes from version.txt. uuid.txt is not
; committed, so this names the default rp/src/CMakeLists.txt falls back to.
template = sidecartridge
uuid = 44444444-4444-4444-8444-444444444444

[sources]
; The firmware and JPEGDEC (through jpegdec_core.c), as
; rp/src/CMakeLists.txt lists them. fb_chunked.c is left out for emu/'s
; version, and the two .S files are not built: emu/ has C versions of
; what they provide.
files =
    emu/*.c
    rp/src/*.c
    rp/src/settings/settings.c
exclude =
    rp/src/fb_chunked.c

[compile]
include =
    rp/src/ff
    rp/src
    rp/src/include
    rp/src/settings
    rp
    jpegdec/src
; CMakeLists.txt gives __MCUXPRESSO only to the three files that include
; JPEGDEC.h; nothing else reads it, so here it is global. (On a Mac,
; JPEGDEC takes the same path for __MACH__; on Linux it needs this.) The
; MQ_* build flags keep their defaults.
defines =
    __MCUXPRESSO
; The hot files' #pragma GCC optimize("O3") is GCC's.
cflags = -O2 -Wno-unknown-pragmas

[run]
; The microSD card: videos go in emu/sd/mjpeg (README.md, "Running it on
; your computer"). Give a TOS image with --tos, or make emu TOS=...
machine = ste
sd = emu/sd
